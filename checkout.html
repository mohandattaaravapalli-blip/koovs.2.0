<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | KOOVS Exclusive</title>
  <meta name="description" content="Complete your KOOVS order. High-street streetwear & limited drop collection." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="checkout-page">

  <!-- HEADER -->
  <header class="header">
    <div class="header__left">
      <a href="index.html" class="header__icon-btn" aria-label="Back to Store">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
    </div>
    
    <div class="header__center">
      <a href="index.html" aria-label="KOOVS Home">
        <img src="assets/images/koovs_official_logo.png" alt="KOOVS Official Logo" class="header__logo" />
      </a>
    </div>

    <div class="header__right">
      <span class="checkout-secure-tag"><i class="fa-solid fa-lock"></i> SECURE CHECKOUT</span>
    </div>
  </header>

  <!-- MAIN CHECKOUT LAYOUT -->
  <main class="checkout-main">
    <div class="checkout-container">
      
      <!-- LEFT: SHIPPING & DEMO PAYMENT -->
      <section class="checkout-section checkout-form-section">
        <h2 class="checkout-section__title">Shipping Address</h2>
        <form class="checkout-form" id="checkoutForm" onsubmit="return false;">
          <div class="form-row">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="e.g. Aarav Sharma" required value="Alex Mercer" />
            </div>
            <div class="form-group">
              <label for="emailAddr">Email Address</label>
              <input type="email" id="emailAddr" placeholder="alex@koovs.in" required value="alex.mercer@koovs.in" />
            </div>
          </div>

          <div class="form-group">
            <label for="streetAddr">Street Address</label>
            <input type="text" id="streetAddr" placeholder="House No., Street Name, Area" required value="100 Feet Road, Indiranagar" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cityName">City</label>
              <input type="text" id="cityName" placeholder="Bengaluru" required value="Bengaluru" />
            </div>
            <div class="form-group">
              <label for="pincode">Pincode</label>
              <input type="text" id="pincode" placeholder="560038" required value="560038" />
            </div>
          </div>

          <h2 class="checkout-section__title" style="margin-top: 32px;">Payment Method</h2>
          <div class="payment-options">
            <label class="payment-card active">
              <input type="radio" name="paymentMethod" checked />
              <i class="fa-solid fa-credit-card"></i>
              <span>Credit / Debit Card (Demo)</span>
            </label>
            <label class="payment-card">
              <input type="radio" name="paymentMethod" />
              <i class="fa-solid fa-wallet"></i>
              <span>UPI / Net Banking (Demo)</span>
            </label>
          </div>

          <button type="submit" class="place-order-btn" id="placeOrderBtn">
            <span>PLACE ORDER (DEMO)</span>
            <i class="fa-solid fa-shield-halved"></i>
          </button>
        </form>
      </section>

      <!-- RIGHT: ORDER SUMMARY -->
      <section class="checkout-section checkout-summary-section">
        <h2 class="checkout-section__title">Order Summary</h2>
        <div class="checkout-items-list" id="checkoutItemsList">
          <!-- Dynamic checkout items -->
        </div>

        <div class="checkout-totals">
          <div class="checkout-total-row">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">₹0</span>
          </div>
          <div class="checkout-total-row">
            <span>Express Delivery</span>
            <span class="free-shipping">FREE</span>
          </div>
          <div class="checkout-total-row">
            <span>Estimated Taxes &amp; Duties</span>
            <span>Included</span>
          </div>
          <div class="checkout-total-row checkout-grand-total">
            <span>Total Payable</span>
            <span id="checkoutGrandTotal">₹0</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- ORDER SUCCESS CONFIRMATION MODAL -->
  <div class="checkout-modal" id="orderSuccessModal" aria-hidden="true">
    <div class="checkout-modal__overlay"></div>
    <div class="checkout-modal__card">
      <div class="checkout-modal__icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h2 class="checkout-modal__title font-milker">Demo Checkout Complete!</h2>
      <p class="checkout-modal__desc">
        Your demo order <strong id="demoOrderId">#KOOVS-84920</strong> has been placed successfully. No real payment was processed.
      </p>
      <div class="checkout-modal__badge">✅ ORDER CONFIRMED</div>
      <a href="index.html" class="checkout-modal__home-btn">
        <span>Back to Store</span>
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>

  <footer class="inner-page-footer">
    <div class="inner-page-footer__container">
      <a href="index.html" aria-label="KOOVS Home">
        <img src="assets/images/koovs_official_logo.png" alt="KOOVS Official Logo" class="inner-page-footer__logo" />
      </a>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
